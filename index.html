<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una invitación especial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root { --fondo: #fffdf9; --texto: #202020; --boton: #e4e8d5; --boton-texto: #a4aaa1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f1f0ec; color: var(--texto); font-family: Georgia, "Times New Roman", serif; }
    .invitacion { width: min(100%, 480px); height: 100svh; margin: 0 auto; background: var(--fondo); overflow: hidden; display: flex; flex-direction: column; }
    .video-contenedor { width: 100%; flex: 1 1 auto; min-height: 0; background: #171717; }
    video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .contenido { flex: 0 0 270px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 28px 18px; text-align: center; }
    h1 { margin: 0 0 12px; font-family: "Great Vibes", "Brush Script MT", cursive; font-size: clamp(2.65rem, 10.5vw, 3.65rem); font-weight: 400; line-height: 0.9; }
    .mensaje { max-width: 380px; margin: 0 auto; font-size: clamp(0.98rem, 4vw, 1.12rem); line-height: 1.34; letter-spacing: 0.01em; }
    .cupos { margin: 0; }
    .boton { display: inline-flex; align-items: center; justify-content: center; min-width: 218px; min-height: 48px; margin-top: 17px; padding: 11px 24px; border-radius: 999px; background: var(--boton); color: var(--boton-texto); font-size: 1rem; text-decoration: underline; text-underline-offset: 3px; transition: transform 160ms ease, filter 160ms ease; }
    .boton:hover { filter: brightness(0.97); transform: translateY(-1px); }
    .boton[aria-disabled="true"] { opacity: 0.65; cursor: not-allowed; }

    /* En pantallas bajas, conserva el botón visible reduciendo un poco el bloque inferior. */
    @media (max-height: 680px) {
      .contenido { flex-basis: 245px; padding-top: 10px; padding-bottom: 12px; }
      h1 { font-size: 2.45rem; margin-bottom: 9px; }
      .mensaje { font-size: 0.93rem; }
      .boton { min-height: 44px; margin-top: 12px; }
    }
  </style>
</head>
<body>
  <main class="invitacion">
    <!-- Sube tu video al repositorio con este nombre exacto: video.mp4 -->
    <div class="video-contenedor">
      <video controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4" />
        Tu navegador no puede reproducir este video.
      </video>
    </div>

    <section class="contenido">
      <h1 id="nombre">[Nombre]</h1>
      <p class="mensaje">Esta historia no sería la misma sin ti. Hemos reservado <span id="texto-cupos">[X] cupo(s)</span> para que nos acompañes en nuestro gran día.</p>
      <a id="boton-informacion" class="boton" href="#" aria-disabled="true">Ver más información</a>
    </section>
  </main>

  <script>
    // PEGA ENTRE LAS COMILLAS el enlace público de tu invitación de Canva.
    // Ejemplo: "https://www.canva.com/design/XXXXXXXX/view"
    const ENLACE_INVITACION_CANVA = "";

    function configurarBoton() {
      const boton = document.getElementById("boton-informacion");
      if (ENLACE_INVITACION_CANVA) {
        boton.href = ENLACE_INVITACION_CANVA;
        boton.removeAttribute("aria-disabled");
      } else {
        boton.addEventListener("click", (evento) => evento.preventDefault());
      }
    }

    async function cargarInvitado() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;

      try {
        const respuesta = await fetch("invitados.json");
        const invitados = await respuesta.json();
        const invitado = invitados[id];
        if (!invitado) return;

        document.getElementById("nombre").textContent = invitado.nombre;
        document.getElementById("texto-cupos").textContent = invitado.cupos === 1
          ? "1 cupo"
          : `${invitado.cupos} cupos`;
      } catch (error) {
        console.log("No se pudieron cargar los datos de la invitación.", error);
      }
    }

    configurarBoton();
    cargarInvitado();
  </script>
</body>
</html>
